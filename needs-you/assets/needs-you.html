<!doctype html>
<title>Needs You</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#5d6875;--line:#dde2e8;--acc:#2f5fd0;--accbg:#e8eefc;--ok:#1d7a46;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1c2026;--ink:#e6e9ee;--mute:#98a2ae;--line:#2d333b;--acc:#7ea2f2;--accbg:#22304d;--ok:#5cc98a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1c2026;--ink:#e6e9ee;--mute:#98a2ae;--line:#2d333b;--acc:#7ea2f2;--accbg:#22304d;--ok:#5cc98a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px 16px 96px}
main{max-width:720px;margin:0 auto;display:grid;gap:12px}
h1{font-size:18px;margin:0}
.sub{color:var(--mute);font-size:13px;margin:0}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}
.q.dirty{border-color:var(--acc)}
.q h2{font-size:15px;margin:0;font-weight:600;text-wrap:balance}
.ctx{color:var(--mute);font-size:13px;margin:0;white-space:pre-wrap}
.ctx a{color:var(--acc)}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.opts label:has(input:checked){background:var(--accbg)}
.rec{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-left:4px}
textarea{width:100%;box-sizing:border-box;min-height:52px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.meta{font-size:12px;color:var(--mute)}
.done{color:var(--ok)}
details{color:var(--mute)}
summary{cursor:pointer;font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
button{font:inherit;border-radius:6px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#status{font-size:13px;color:var(--mute)}
</style>
<main>
  <div><h1>Needs you</h1><p class="sub">Claude's open questions. Pick an answer or write one, then save.</p></div>
  <div id="open"></div>
  <details id="old"><summary>Answered</summary><div id="answered"></div></details>
</main>
<div class="bar"><span id="status">Loading…</span><button id="save" class="pri" disabled>Save and tell Claude</button></div>
<script>
const $=s=>document.querySelector(s);const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link=t=>esc(t).replace(/(https:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
let db,cm,docs=[];const dirty=new Map();
function render(){
  const open=docs.filter(d=>d.status!=="answered"),done=docs.filter(d=>d.status==="answered");
  $("#open").innerHTML=open.length?open.map(card).join(""):'<p class="sub">Nothing needs you right now.</p>';
  $("#answered").innerHTML=done.map(d=>`<div class="q"><h2>${esc(d.text)}</h2><p class="meta done">${esc(d.answer||"")}${d.note?" · "+esc(d.note):""}</p></div>`).join("");
  $("#old").hidden=!done.length;
  for(const[id,v]of dirty){const el=document.getElementById("q-"+id);if(!el)continue;el.classList.add("dirty");
    if(v.answer!=null){const r=el.querySelector(`input[value="${CSS.escape(v.answer)}"]`);if(r)r.checked=true}
    if(v.note!=null)el.querySelector("textarea").value=v.note}
  $("#save").disabled=!dirty.size;
}
function card(d){
  const opts=(d.options||[]).map(o=>`<label><input type="radio" name="r-${d.id}" value="${esc(o)}"${d.answer===o?" checked":""}><span>${esc(o)}${o===d.recommended?'<span class="rec">recommended</span>':""}</span></label>`).join("");
  return `<section class="q" id="q-${d.id}" data-id="${d.id}"><h2>${esc(d.text)}</h2>${d.context?`<p class="ctx">${link(d.context)}</p>`:""}${opts?`<div class="opts">${opts}</div>`:""}<textarea id="t-${d.id}" placeholder="${opts?"Anything to add (optional)":"Your answer"}">${esc(d.note||"")}</textarea>${d.default?`<p class="meta">If you don't answer: ${esc(d.default)}</p>`:""}</section>`;
}
document.addEventListener("input",e=>{const q=e.target.closest(".q[data-id]");if(!q)return;const id=q.dataset.id,v=dirty.get(id)||{};
  if(e.target.type==="radio")v.answer=e.target.value;else v.note=e.target.value;dirty.set(id,v);q.classList.add("dirty");$("#save").disabled=false;$("#status").textContent="Unsaved changes"});
$("#save").onclick=async()=>{$("#save").disabled=true;$("#status").textContent="Saving…";const saved=[];
  try{for(const[id,v]of dirty){const d=docs.find(x=>x.id===id)||{};const answer=v.answer??d.answer??null,note=(v.note??d.note??"").trim();
      await db.doc("q/"+id).update({answer,note,status:(answer||note)?"answered":"open",answeredAt:new Date().toISOString()});dirty.delete(id);saved.push(d.text||id)}}
  catch(e){$("#status").textContent="Not saved: "+(e.message||e.code);$("#save").disabled=false;return}
  $("#status").textContent="Saved";if(!cm)return;
  try{if(await cm.canSendToClaude()!=="available"){$("#status").textContent="Saved. Claude isn't reachable from here: say so in chat.";return}
    const text="Answers saved: "+saved.map(t=>t.slice(0,60)).join(" | ");
    const m=await db.doc("meta/thread").get(),tid=m.exists?m.data().id:null;
    const r=tid?await cm.sendToClaude({threadId:tid,text}).catch(()=>null):null;
    const out=r||await cm.sendToClaude({anchor:await cm.anchorFor($("#save")),text});
    if(!r)await db.doc("meta/thread").set({id:out.threadId});
    $("#status").textContent="Saved and sent to Claude"}
  catch(e){$("#status").textContent=e.code==="consent_required"?"Saved. Allow comments on this page to notify Claude, or say so in chat.":"Saved. Couldn't notify Claude: "+(e.message||e.code)}};
(async()=>{db=await window.claude.use("db");cm=await window.claude.use("comments");
  if(!db){$("#status").textContent="Open this page signed in to answer.";return}
  db.collection("q").orderBy("created","desc").onSnapshot(s=>{docs=s.docs.map(x=>({id:x.id,...x.data()}));render();if(!dirty.size)$("#status").textContent=docs.some(d=>d.status!=="answered")?"Waiting for you":"All answered"},
    e=>{$("#status").textContent="Can't load questions: "+e.message})})();
</script>
