name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v5

      - name: Validate skills against the Agent Skills spec
        # skills-ref on PyPI is the official Anthropic validator
        # (github.com/anthropics/agentskills); the npm package of the same
        # name is an unrelated third-party port — do not use it.
        run: |
          set -euo pipefail
          fail=0
          seen=0
          for dir in */; do
            skill="${dir%/}"
            [ -f "$skill/SKILL.md" ] || continue
            seen=$((seen + 1))
            echo "::group::$skill"
            uvx --from skills-ref==0.1.1 agentskills validate "./$skill" || fail=1
            echo "::endgroup::"
          done
          if [ "$seen" -eq 0 ]; then
            echo "No SKILL.md found in any top-level directory" >&2
            exit 1
          fi
          exit "$fail"

      - name: Check the vendor manifest matches the vendored directories
        # --verify only compares vendor.toml against the .vendored stamps on
        # disk, so it never touches the network. Deliberately NOT --check:
        # that one goes red the moment an upstream repo moves, which is the
        # vendor-skills workflow's job to fix, not a reason to block a PR.
        run: scripts/vendor-skills.sh --verify

      - name: Lint shell scripts
        # Gated at warning: the only info-level findings today are SC2016 in
        # claude-rc-spawn, which deliberately emits literal ${cmd[@]} into a
        # script it generates. Drop to --severity=style to see those.
        #
        # Pinned rather than using the runner image's shellcheck, so an image
        # bump cannot turn CI red with no code change.
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          shellcheck="/tmp/shellcheck-$SHELLCHECK_VERSION/shellcheck"
          "$shellcheck" --version

          files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              *.sh) files+=("$f") ;;
              *)
                [ -f "$f" ] || continue
                IFS= read -r shebang <"$f" || continue
                case "$shebang" in
                  '#!'*bash* | '#!'*/sh | '#!'*' sh') files+=("$f") ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found — discovery is probably broken" >&2
            exit 1
          fi
          printf 'linting %s scripts:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          "$shellcheck" --severity=warning --color=always -- "${files[@]}"

      - name: Validate plugin marketplace
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.215
          claude plugin validate . --strict
