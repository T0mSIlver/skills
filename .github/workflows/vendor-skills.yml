name: vendor-skills

# Re-vendors each entry of vendor.toml daily and opens one PR per skill that
# moved upstream. Vendored copies are pristine — the PR is a verbatim import,
# so review the upstream diff, never patch the copy in this repo. PRs whose
# diff is only the commit pin (no skill files changed) merge themselves once
# validate passes; anything touching skill content waits for review.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Vendor just this skill (blank = all of vendor.toml)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vendor-skills
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.read.outputs.skills }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the vendor manifest
        id: read
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          # tomllib is stdlib on the runner's python3 — no pip install needed.
          skills="$(python3 -c '
          import json, os, tomllib
          with open("vendor.toml", "rb") as fh:
              names = [s["name"] for s in tomllib.load(fh).get("skills", [])]
          only = os.environ.get("ONLY", "").strip()
          if only:
              names = [n for n in names if n == only]
              if not names:
                  raise SystemExit("no manifest entry named " + only)
          print(json.dumps(names))
          ')"
          echo "skills=$skills" >>"$GITHUB_OUTPUT"
          echo "will vendor: $skills"

  vendor:
    needs: list
    if: needs.list.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.list.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4

      - name: Vendor the skill
        env:
          SKILL: ${{ matrix.skill }}
        run: scripts/vendor-skills.sh --only "$SKILL" --summary "$RUNNER_TEMP/summary.md"

      - name: Collect PR metadata
        id: meta
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "$SKILL is already at the upstream commit"
            exit 0
          fi
          sha="$(python3 -c '
          import json, os
          with open(os.environ["SKILL"] + "/.vendored", encoding="utf-8") as fh:
              print(json.load(fh)["commit"])
          ')"
          {
            echo "changed=true"
            echo "short=${sha:0:7}"
          } >>"$GITHUB_OUTPUT"

      - name: Open or update the PR
        if: steps.meta.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          # VENDOR_PR_TOKEN must be a PAT with contents:write and
          # pull_requests:write. Without it the fallback GITHUB_TOKEN still
          # opens the PR, but GitHub does not fire `pull_request` workflows for
          # anything pushed with it — so validate.yml would never run on the
          # bot's PR and the vendored skill would land unvalidated.
          token: ${{ secrets.VENDOR_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: vendor/${{ matrix.skill }}
          commit-message: 'vendor: update ${{ matrix.skill }} to ${{ steps.meta.outputs.short }}'
          title: 'vendor: update ${{ matrix.skill }} to ${{ steps.meta.outputs.short }}'
          body-path: ${{ runner.temp }}/summary.md
          labels: vendor
          delete-branch: true

      - name: Auto-merge when only the pin moved
        if: steps.meta.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.VENDOR_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          SKILL: ${{ matrix.skill }}
        run: |
          set -euo pipefail
          # A diff of just <skill>/.vendored + vendor.toml means upstream moved
          # without touching the skill's files — nothing to review, so merge as
          # soon as validate passes. Any other file leaves the PR for review.
          extra="$(gh pr view "$PR" --json files --jq '.files[].path' \
            | grep -vxF -e "$SKILL/.vendored" -e vendor.toml || true)"
          if [ -n "$extra" ]; then
            echo "skill content changed; leaving PR #$PR for review:"
            echo "$extra"
            exit 0
          fi
          # The pull_request-triggered validate run takes a few seconds to
          # register on the PR (gh exit code 8 = registered but pending).
          for _ in $(seq 1 24); do
            rc=0
            gh pr checks "$PR" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 8 ]; then break; fi
            sleep 5
          done
          gh pr checks "$PR" --watch --fail-fast
          # Sibling matrix jobs merge concurrently and each touches vendor.toml,
          # so a merge can fail transiently while GitHub recomputes mergeability.
          for _ in 1 2 3; do
            if gh pr merge "$PR" --squash --delete-branch; then exit 0; fi
            sleep 20
          done
          exit 1
