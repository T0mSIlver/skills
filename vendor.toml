# Skills vendored from other repositories. See docs/vendoring.md.
#
# Vendored copies are PRISTINE: never patch them in-tree, send fixes upstream.
# `commit` is the pinned upstream SHA; scripts/vendor-skills.sh bumps it, and
# the vendor-skills workflow opens the PR that carries the bump.
#
# TOML rather than YAML so the parser is python3 stdlib (tomllib) with no
# third-party dependency to install on a runner.

[[skills]]
name = "unslop"
repo = "https://github.com/cursor/plugins"
ref = "main"
path = "pstack/skills/unslop"
license = "pstack/LICENSE"
commit = "6b0300214a09fd6029cfb7077043125758cd1fd2"
# Upstream ships it user-only; I want the model to reach for it on its own.
frontmatter = { disable-model-invocation = false }

# Starbridge's own skill: how an agent asks its owner through the Starbridge
# app. It is my own repo, so content updates merge on green too.
[[skills]]
name = "starbridge"
repo = "https://github.com/T0mSIlver/starbridge"
ref = "main"
path = "plugin/skills/starbridge"
license = "LICENSE"
commit = "20d47cc217c8e68b2681cb0d573aa4f6ad68ac4f"
automerge = true

# Theo Browne's council skill, from his tstack repo.
[[skills]]
