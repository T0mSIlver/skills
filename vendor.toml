# Skills vendored from other repositories. See docs/vendoring.md.
#
# Vendored copies are PRISTINE: never patch them in-tree, send fixes upstream.
# `commit` is the pinned upstream SHA; scripts/vendor-skills.sh bumps it, and
# the vendor-skills workflow opens the PR that carries the bump.
#
# TOML rather than YAML so the parser is python3 stdlib (tomllib) with no
# third-party dependency to install on a runner.

[[skills]]
name = "unslop"
repo = "https://github.com/cursor/plugins"
ref = "main"
path = "pstack/skills/unslop"
license = "pstack/LICENSE"
commit = "efa2a531985e0a8084d36ff3cf87233be8a9f34b"

